name: mypy

on: [push]

env:
  PYTHON_VERSION: "3.9"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install .[test,mypy]
      - name: Running Mypy
        run: |
          mypy .
